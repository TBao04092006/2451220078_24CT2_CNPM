version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: libranova_app
    ports:
      - "8000:8000"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=libranova_db
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: libranova_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: libranova_db
      MYSQL_USER: libranova_user
      MYSQL_PASSWORD: libranova_secret
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
    driver: local